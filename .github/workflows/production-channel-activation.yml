name: Communication production activation admission

on:
  pull_request:
    paths:
      - "app/activation.py"
      - "app/production.py"
      - "sitecustomize.py"
      - "Dockerfile"
      - "config/production-channel-activation.template.json"
      - "scripts/build_activation_receipt.py"
      - "tests/test_activation_policy.py"
      - "docs/PRODUCTION-CHANNEL-ACTIVATION.md"
      - ".github/workflows/production-channel-activation.yml"
  push:
    branches: [main]
    paths:
      - "app/activation.py"
      - "app/production.py"
      - "sitecustomize.py"
      - "Dockerfile"
      - "config/production-channel-activation.template.json"
      - "scripts/build_activation_receipt.py"
      - "tests/test_activation_policy.py"
      - "docs/PRODUCTION-CHANNEL-ACTIVATION.md"
      - ".github/workflows/production-channel-activation.yml"
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact protected main SHA embedded in the candidate image
        required: true
        type: string
      image_digest:
        description: Exact sha256 OCI digest for ghcr.io/appolon1908-hue/codestra-communication
        required: true
        type: string
      evidence_path:
        description: Repository-relative sanitized evidence JSON under evidence/production/
        required: true
        type: string
      receipt_id:
        description: Unique bounded activation receipt identity
        required: true
        type: string
      independent_approver:
        description: Independent approver identity from the protected approval record
        required: true
        type: string
      approval_url:
        description: GitHub URL for the exact-candidate independent approval
        required: true
        type: string
      canary_percent:
        description: Initial email+SMS traffic percentage; must be >0 and <=1
        required: true
        type: string
      not_before:
        description: UTC ISO-8601 activation start
        required: true
        type: string
      expires_at:
        description: UTC ISO-8601 expiry no more than four hours later
        required: true
        type: string
      confirmation:
        description: Type BUILD_EMAIL_SMS_CANARY_RECEIPT
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: communication-production-activation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  activation-policy:
    name: Validate production activation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Validate activation source and regressions
        run: |
          set -Eeuo pipefail
          python -m compileall -q app scripts tests sitecustomize.py
          python -m pytest -q tests/test_activation_policy.py
          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(
              Path("config/production-channel-activation.template.json").read_text()
          )
          assert document["verdict"] == "BLOCKED"
          assert document["business_writes_enabled"] is False
          assert document["external_delivery_enabled"] is False
          assert document["live_email_enabled"] is False
          assert document["live_sms_enabled"] is False
          assert document["live_pstn_enabled"] is False
          assert document["callback_dispatch_enabled"] is False
          assert document["n8n_activation_enabled"] is False
          assert document["odoo_write_enabled"] is False
          print("COMMUNICATION_ACTIVATION_TEMPLATE=PASS")
          PY

  build-signed-canary-receipt:
    name: Build signed email and SMS canary receipt
    if: github.event_name == 'workflow_dispatch'
    needs: activation-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: communication-production-activation
    steps:
      - name: Check out exact selected main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact signed source and bounded inputs
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
          INDEPENDENT_APPROVER: ${{ inputs.independent_approver }}
          APPROVAL_URL: ${{ inputs.approval_url }}
          CANARY_PERCENT: ${{ inputs.canary_percent }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "main"
          test "$CONFIRMATION" = "BUILD_EMAIL_SMS_CANARY_RECEIPT"
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          case "$EXPECTED_SOURCE_SHA" in
            ????????????????????????????????????????) ;;
            *) printf 'ERROR=EXPECTED_SOURCE_SHA_INVALID\n' >&2; exit 1 ;;
          esac
          case "$EXPECTED_SOURCE_SHA" in
            *[!0-9a-f]*) printf 'ERROR=EXPECTED_SOURCE_SHA_INVALID\n' >&2; exit 1 ;;
          esac
          case "$IMAGE_DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) printf 'ERROR=IMAGE_DIGEST_INVALID\n' >&2; exit 1 ;;
          esac
          case "$EVIDENCE_PATH" in
            evidence/production/*.json) ;;
            *) printf 'ERROR=EVIDENCE_PATH_INVALID\n' >&2; exit 1 ;;
          esac
          case "$EVIDENCE_PATH" in
            *..*|/*) printf 'ERROR=EVIDENCE_PATH_TRAVERSAL\n' >&2; exit 1 ;;
          esac
          test -f "$EVIDENCE_PATH"
          test ! -L "$EVIDENCE_PATH"
          test -n "$INDEPENDENT_APPROVER"
          test "$INDEPENDENT_APPROVER" != "$GITHUB_ACTOR"
          case "$APPROVAL_URL" in
            https://github.com/*) ;;
            *) printf 'ERROR=APPROVAL_URL_INVALID\n' >&2; exit 1 ;;
          esac
          python - "$CANARY_PERCENT" <<'PY'
          import sys
          value = float(sys.argv[1])
          if not 0 < value <= 1:
              raise SystemExit("ERROR=CANARY_PERCENT_OUT_OF_RANGE")
          PY
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SOURCE_SHA" \
            > "$RUNNER_TEMP/source-commit.json"
          python - "$RUNNER_TEMP/source-commit.json" <<'PY'
          import json
          import pathlib
          import sys
          document = json.loads(pathlib.Path(sys.argv[1]).read_text())
          verification = document.get("commit", {}).get("verification", {})
          if verification.get("verified") is not True:
              raise SystemExit(
                  "ERROR=SOURCE_COMMIT_SIGNATURE_NOT_VERIFIED:"
                  + str(verification.get("reason", "unknown"))
              )
          print("SOURCE_COMMIT_SIGNATURE=PASS")
          PY

      - name: Verify immutable registry digest and embedded source revision
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          image="ghcr.io/appolon1908-hue/codestra-communication@$IMAGE_DIGEST"
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_SOURCE_SHA"
          printf 'IMMUTABLE_IMAGE_READBACK=PASS\n'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and self-verify signed activation receipt
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
          RECEIPT_ID: ${{ inputs.receipt_id }}
          INDEPENDENT_APPROVER: ${{ inputs.independent_approver }}
          APPROVAL_URL: ${{ inputs.approval_url }}
          CANARY_PERCENT: ${{ inputs.canary_percent }}
          NOT_BEFORE: ${{ inputs.not_before }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          ACTIVATION_HMAC_KEY: ${{ secrets.COMMUNICATION_ACTIVATION_HMAC_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ACTIVATION_HMAC_KEY"
          key_file="$RUNNER_TEMP/communication-activation.key"
          output="$RUNNER_TEMP/communication-activation-receipt.json"
          umask 077
          printf '%s' "$ACTIVATION_HMAC_KEY" > "$key_file"
          python scripts/build_activation_receipt.py \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --image-digest "$IMAGE_DIGEST" \
            --evidence "$EVIDENCE_PATH" \
            --key-file "$key_file" \
            --output "$output" \
            --receipt-id "$RECEIPT_ID" \
            --approver "$INDEPENDENT_APPROVER" \
            --deployment-operator "$GITHUB_ACTOR" \
            --approval-url "$APPROVAL_URL" \
            --canary-percent "$CANARY_PERCENT" \
            --not-before "$NOT_BEFORE" \
            --expires-at "$EXPIRES_AT"
          test -s "$output"
          sha256sum "$output" > "$RUNNER_TEMP/communication-activation-receipt.sha256"
          rm -f "$key_file"
          printf 'PRODUCTION_DEPLOYED=NO\n'
          printf 'LIVE_EMAIL_DELIVERY=NOT_YET_APPLIED\n'
          printf 'LIVE_SMS_DELIVERY=NOT_YET_APPLIED\n'
          printf 'LIVE_PSTN_DIALING=false\n'
          printf 'CALLBACK_DISPATCH=false\n'
          printf 'N8N_ACTIVATION=false\n'
          printf 'ODOO_WRITE=false\n'

      - name: Upload short-lived signed activation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: communication-email-sms-canary-${{ inputs.receipt_id }}
          path: |
            ${{ runner.temp }}/communication-activation-receipt.json
            ${{ runner.temp }}/communication-activation-receipt.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
