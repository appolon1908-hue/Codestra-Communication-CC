name: Fix Communication event outbox test ordering

on:
  push:
    branches:
      - fix/communication-production-remediation-v2-20260903
    paths:
      - scripts/fix-event-outbox-test-order.py
      - .github/workflows/fix-event-outbox-test-order.yml

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'appolon1908-hue/Codestra-Communication-CC' &&
      github.actor == 'appolon1908-hue'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/communication-production-remediation-v2-20260903
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact branch authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "fix/communication-production-remediation-v2-20260903"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply deterministic test correction
        run: python scripts/fix-event-outbox-test-order.py
      - name: Validate source
        run: |
          python -m compileall -q tests scripts
          git diff --check
      - name: Commit corrected test
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "codestra-remediation-bot"
          git config user.email "codestra-remediation-bot@users.noreply.github.com"
          git add tests/test_stage5_postgres.py
          git diff --cached --quiet && {
            echo "ERROR=no_test_correction" >&2
            exit 1
          }
          git commit -m "test(events): isolate attempt-fencing claim order"
          git push origin HEAD:fix/communication-production-remediation-v2-20260903
