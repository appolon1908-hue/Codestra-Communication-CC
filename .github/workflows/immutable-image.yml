name: Immutable image

on:
  pull_request:
  push:
    branches:
      - main
      - development
      - testing
      - staging
      - production
      - 'section/**'
      - 'subsection/**'

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          tags: codestra-communication:ci-${{ github.sha }}
          build-args: |
            SOURCE_SHA=${{ github.sha }}
            RELEASE_VERSION=sha-${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ghcr.io/appolon1908/codestra-communication:${{ github.sha }}
          build-args: |
            SOURCE_SHA=${{ github.sha }}
            RELEASE_VERSION=sha-${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
