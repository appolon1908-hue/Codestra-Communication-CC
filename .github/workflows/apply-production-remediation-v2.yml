name: Apply Communication production remediation v2

on:
  push:
    branches:
      - fix/communication-production-remediation-v2-20260903
    paths:
      - scripts/apply-production-remediation-v2.py
      - .github/workflows/apply-production-remediation-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'appolon1908-hue/Codestra-Communication-CC' &&
      github.actor == 'appolon1908-hue'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/communication-production-remediation-v2-20260903
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact branch authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "fix/communication-production-remediation-v2-20260903"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f scripts/apply-production-remediation-v2.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply exact reviewed source changes
        run: python scripts/apply-production-remediation-v2.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Regenerate and validate contracts
        run: |
          python scripts/export_openapi.py
          python scripts/validate_openapi_parity.py

      - name: Validate non-database source gates
        run: |
          python -m compileall -q app scripts tests
          pytest -q -m 'not postgres'
          git diff --check

      - name: Commit the reviewed remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "codestra-remediation-bot"
          git config user.email "codestra-remediation-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "ERROR=no_remediation_changes" >&2
            exit 1
          }
          git commit -m "fix(api): close Communication production blockers"
          git push origin HEAD:fix/communication-production-remediation-v2-20260903
