name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m compileall -q app scripts tests
      - run: pytest -q -m 'not postgres'
      - run: python scripts/validate_openapi_parity.py
      - name: Validate Prometheus alert rules
        run: >-
          docker run --rm --entrypoint=/bin/promtool
          -v "$PWD/observability:/rules:ro"
          prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
          check rules /rules/communication-alerts.yaml
      - run: python -c "from app.main import app, EXTERNAL_DELIVERY_ENABLED; assert app; assert EXTERNAL_DELIVERY_ENABLED is False"

  postgres-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codestra_communication_stage5
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codestra_communication_stage5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/codestra_communication_stage5
      POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/codestra_communication_stage5
      EXTERNAL_DELIVERY_ENABLED: 'false'
      COMMUNICATION_DATA_KEY_DIR: /tmp/codestra-communication-test-keys
      COMMUNICATION_ACTIVE_DATA_KEY_ID: key-1
      COMMUNICATION_BLIND_INDEX_KEY_ID: key-1
      COMMUNICATION_ALLOW_LEGACY_PLAINTEXT_READS: 'true'
      COMMUNICATION_DESTRUCTIVE_CERTIFICATION: 'YES'
      COMMUNICATION_CERTIFICATION_DATABASE: codestra_communication_stage5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - name: Create ephemeral test data-protection key
        run: |
          install -d -m 700 "$COMMUNICATION_DATA_KEY_DIR"
          openssl rand -out "$COMMUNICATION_DATA_KEY_DIR/$COMMUNICATION_ACTIVE_DATA_KEY_ID.key" 32
          chmod 600 "$COMMUNICATION_DATA_KEY_DIR/$COMMUNICATION_ACTIVE_DATA_KEY_ID.key"
      - run: python scripts/certify_stage5_postgres.py
      - run: python scripts/certify_data_protection_migration.py
      - run: pytest -q -m postgres
      - name: Certify isolated logical backup and restore
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$(mktemp -d)"
          restore_dir="$(mktemp -d)"
          restore_db="codestra_communication_restore_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          postgres_image="postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193"
          pg_client() {
            docker run --rm --network host --user "$(id -u):$(id -g)" \
              -e PGPASSWORD=postgres -v "$backup_dir:/backup" -v "$restore_dir:/restore" "$postgres_image" "$@"
          }
          cleanup() {
            pg_client dropdb -h 127.0.0.1 -U postgres --if-exists "$restore_db" >/dev/null 2>&1 || true
            find "$backup_dir" -type f -delete
            rmdir "$backup_dir"
            find "$restore_dir" -type f -delete
            rmdir "$restore_dir"
          }
          trap cleanup EXIT
          pg_client pg_dump -h 127.0.0.1 -U postgres -d codestra_communication_stage5 \
            --format=custom --no-owner --no-privileges --file=/backup/communication.dump
          sha256sum "$backup_dir/communication.dump" > "$backup_dir/communication.dump.sha256"
          cp "$backup_dir/communication.dump" "$backup_dir/communication.dump.sha256" "$restore_dir/"
          (cd "$restore_dir" && sha256sum --check communication.dump.sha256)
          pg_client createdb -h 127.0.0.1 -U postgres "$restore_db"
          pg_client pg_restore -h 127.0.0.1 -U postgres -d "$restore_db" \
            --no-owner --no-privileges --exit-on-error /restore/communication.dump
          pg_client pg_dump -h 127.0.0.1 -U postgres -d codestra_communication_stage5 \
            --schema-only --no-owner --no-privileges --file=/backup/source-schema.sql
          pg_client pg_dump -h 127.0.0.1 -U postgres -d "$restore_db" \
            --schema-only --no-owner --no-privileges --file=/restore/restored-schema.sql
          diff -u "$backup_dir/source-schema.sql" "$restore_dir/restored-schema.sql"
          pg_client pg_dump -h 127.0.0.1 -U postgres -d codestra_communication_stage5 \
            --data-only --no-owner --no-privileges --file=/backup/source-data.sql
          pg_client pg_dump -h 127.0.0.1 -U postgres -d "$restore_db" \
            --data-only --no-owner --no-privileges --file=/restore/restored-data.sql
          diff -u "$backup_dir/source-data.sql" "$restore_dir/restored-data.sql"
          echo "COMMUNICATION_ISOLATED_BACKUP_RESTORE=PASS"
