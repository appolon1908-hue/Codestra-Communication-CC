name: calling-contract-pin
on:
  pull_request:
    paths: [".codestra/calling-contract.lock.json"]
  push:
    branches: ["main"]
    paths: [".codestra/calling-contract.lock.json"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce issue 257 contract and fail-closed default
        run: |
          test "$(jq -r .version .codestra/calling-contract.lock.json)" = "1.0.0"
          test "$(jq -r .sha256 .codestra/calling-contract.lock.json)" = "856f55ce980fe661a6a326c1a70207496f0eb3fc4bc335141e874c075b5a7e93"
          test "$(jq -r .external_effects_enabled .codestra/calling-contract.lock.json)" = "false"
