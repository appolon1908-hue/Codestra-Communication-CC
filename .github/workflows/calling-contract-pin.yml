name: calling-contract-pin
on:
  pull_request:
    paths: [".codestra/calling-contract.lock.json"]
  push:
    branches: ["main"]
    paths: [".codestra/calling-contract.lock.json"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce issue 257 contract and fail-closed default
        run: |
          test "$(jq -r .version .codestra/calling-contract.lock.json)" = "1.0.0"
          test "$(jq -r .sha256 .codestra/calling-contract.lock.json)" = "b39cdffe56a8185c91174228f0423df68b1137f34875f6ee52f9914f904bf724"
          test "$(jq -r .external_effects_enabled .codestra/calling-contract.lock.json)" = "false"
